services:
  user-service:
    build: ./users_service
    container_name: user-service
    ports:
      - "8001:8000"
    volumes:
      - ./users_service:/app

  like-service:
    build: ./like_service
    container_name: like-service
    ports:
      - "8002:8000"
    volumes:
      - ./like_service:/app